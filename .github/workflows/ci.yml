name: Verify learning workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public endpoint only. Auth and PostgreSQL RLS enforce data access.
      NEXT_PUBLIC_NEON_DATABASE_URL: https://ep-billowing-moon-bd20lbox.c-8.us-east-2.aws.neon.tech/neondb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Prepare authentication formatting patch
        run: |
          bunx biome check --write package.json src/auth/shared.ts src/components/member-auth-forms.tsx src/components/auth-bridge.tsx src/app/layout.tsx src/auth/actions.ts src/auth/state.ts tests/member-sessions.test.ts tests/member-actions.test.ts
          git diff -- package.json src/auth/shared.ts src/components/member-auth-forms.tsx src/components/auth-bridge.tsx src/app/layout.tsx src/auth/actions.ts src/auth/state.ts tests/member-sessions.test.ts tests/member-actions.test.ts
      - run: bun run check
      - run: bun run typecheck
      - run: bun run content:check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dev-map-lab-static
          path: out/
          retention-days: 7
