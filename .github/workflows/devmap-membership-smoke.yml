name: Dev Map Lab disposable membership smoke
on:
  pull_request:
    paths:
      - ".github/workflows/devmap-membership-smoke.yml"
permissions:
  contents: read
jobs:
  membership:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/devmap-membership-smoke-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_NEON_DATABASE_URL: https://ep-winter-dream-bdvu662b.c-8.us-east-2.aws.neon.tech/neondb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/devmap-playwright" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/devmap-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify signup, password reset and backup in the Neon development branch
        run: |
          python3 -m http.server 39281 --bind 127.0.0.1 --directory out >/dev/null 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --fail --silent --retry-connrefused --retry 8 http://localhost:39281/account/ >/dev/null
          cat > "$RUNNER_TEMP/devmap-test.mjs" <<'NODE_TEST'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { setTimeout as delay } from 'node:timers/promises';

          const require = createRequire(process.env.RUNNER_TEMP + '/devmap-playwright/node_modules/playwright/package.json');
          const { chromium } = require('playwright');
          const site = 'http://localhost:39281';
          const devHost = 'ep-winter-dream-bdvu662b.neonauth.c-8.us-east-2.aws.neon.tech';
          const redactions = [];

          function clean(value) {
            return redactions.reduce((text, item) => text.replaceAll(item, '[test value]'), String(value)).replace(/\b\d{6}\b/g, '[code]');
          }

          function secret() {
            const value = 'Qa-' + randomUUID() + '#4';
            redactions.push(value);
            return value;
          }

          async function mail(path, { body, token } = {}) {
            const response = await fetch('https://api.mail.tm' + path, {
              method: body ? 'POST' : 'GET',
              headers: {
                accept: 'application/ld+json',
                ...(body ? { 'content-type': 'application/json' } : {}),
                ...(token ? { authorization: 'Bearer ' + token } : {}),
              },
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(12_000),
            });
            if (!response.ok) throw new Error('Disposable mailbox API HTTP ' + response.status);
            return response.json();
          }

          async function identity(domain) {
            const address = 'devmapqa-' + randomUUID().slice(0, 14) + '@' + domain;
            redactions.push(address);
            const credential = { address, password: secret() };
            await mail('/accounts', { body: credential });
            const { token } = await mail('/token', { body: credential });
            assert(token);
            redactions.push(token);
            return { address, token, password: secret(), seen: new Set() };
          }

          async function receive(identity, purpose) {
            const deadline = Date.now() + 85_000;
            while (Date.now() < deadline) {
              const inbox = await mail('/messages', { token: identity.token });
              for (const summary of inbox['hydra:member'] ?? []) {
                if (identity.seen.has(summary.id) || summary.from?.address !== 'auth@mail.myneon.app') continue;
                const message = await mail('/messages/' + summary.id, { token: identity.token });
                const code = /\b\d{6}\b/.exec(message.text ?? '')?.[0];
                if (!code) continue;
                identity.seen.add(summary.id);
                redactions.push(code);
                console.log('Received synthetic ' + purpose + ' OTP from Neon shared SMTP');
                return code;
              }
              await delay(3000);
            }
            throw new Error('No mail received for ' + purpose + ' within 85 seconds');
          }

          async function open(browser, label) {
            const context = await browser.newContext();
            const page = await context.newPage();
            page.setDefaultTimeout(16_000);
            await page.route('**/*', async (route) => {
              const url = new URL(route.request().url());
              if (url.hostname.endsWith('.neon.tech') && !url.hostname.startsWith('ep-winter-dream-bdvu662b.')) {
                await route.abort();
                return;
              }
              await route.continue();
            });
            page.on('response', (response) => {
              const url = new URL(response.url());
              if (url.hostname === devHost && response.request().method() !== 'OPTIONS' && /sign-up|sign-in|email-otp/.test(url.pathname)) {
                console.log(label + ' ' + url.pathname + ' HTTP ' + response.status());
              }
            });
            return page;
          }

          const form = (page, name) => page.getByRole('form', { name, exact: true });
          const button = (container, name) => container.getByRole('button', { name, exact: true });
          const input = (container, name) => container.getByLabel(name, { exact: true });
          const signedIn = (page) => button(page, '登出此裝置').waitFor();

          async function account(page) {
            await page.goto(site + '/account/', { waitUntil: 'domcontentloaded' });
            await page.getByRole('heading', { name: '會員與備份', exact: true }).waitFor();
          }

          async function passwordFields(container, value, confirm = false) {
            await input(container, '密碼').fill(value);
            if (confirm) await input(container, '再次輸入密碼').fill(value);
          }

          async function signup(page, fixture, name) {
            await account(page);
            await button(page, '建立帳號').click();
            const registration = form(page, '建立帳號');
            await input(registration, 'Email').fill(fixture.address);
            await input(registration, '顯示名稱（選填）').fill(name);
            await passwordFields(registration, fixture.password, true);
            await button(registration, '建立帳號').click();
            const verification = form(page, '驗證 Email');
            await input(verification, '驗證碼').waitFor();
            assert.equal(await button(page, '登出此裝置').count(), 0);
            await input(verification, '驗證碼').fill(await receive(fixture, 'signup'));
            await button(verification, '驗證 Email').click();
            await signedIn(page);
          }

          async function login(page, fixture, old = false) {
            await account(page);
            const login = form(page, '登入');
            await input(login, 'Email').fill(fixture.address);
            await passwordFields(login, fixture.password);
            await button(login, '登入').click();
            if (old) await page.getByText('Email 或密碼不正確，請確認後再試。', { exact: true }).waitFor();
            else await signedIn(page);
          }

          async function lesson(page) {
            await page.goto(site + '/learn/javascript-closures/', { waitUntil: 'domcontentloaded' });
            const note = page.getByRole('textbox', { name: '本單元整頁筆記', exact: true });
            await note.waitFor();
            return note;
          }

          async function backup(page, noteBody) {
            const note = await lesson(page);
            await note.fill(noteBody);
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForFunction((expected) => document.querySelector('#page-note')?.value === expected, noteBody);
            await account(page);
            await page.getByText('還沒有雲端備份。', { exact: true }).waitFor();
            await button(page, '備份到雲端').click();
            await page.getByText(/目前雲端版本 1，包含 1 則筆記/).waitFor();
          }

          async function recover(page, fixture, replacement) {
            await account(page);
            await button(page, '忘記密碼').click();
            const request = form(page, '忘記密碼');
            await input(request, 'Email').fill(fixture.address);
            await button(request, '忘記密碼').click();
            const reset = form(page, '設定新密碼');
            await input(reset, '驗證碼').waitFor();
            await input(reset, '驗證碼').fill(await receive(fixture, 'password reset'));
            await passwordFields(reset, replacement, true);
            await button(reset, '設定新密碼').click();
            await page.getByText('密碼已更新，請重新登入。', { exact: true }).waitFor();
          }

          let stage = 'starting isolated browser sessions';
          let activePage;
          const browser = await chromium.launch();
          try {
            stage = 'provisioning password-protected temporary inboxes';
            const domains = (await mail('/domains'))['hydra:member'];
            const domain = domains?.find((option) => option.isActive && !option.isPrivate)?.domain;
            assert(domain, 'No public disposable-mail domain available');
            const first = await identity(domain);
            const second = await identity(domain);
            const firstPage = await open(browser, 'A');
            const secondDevice = await open(browser, 'A second browser context');
            const secondPage = await open(browser, 'B');
            stage = 'first account email verification';
            activePage = firstPage;
            await signup(firstPage, first, 'Dev Map QA A 2026-11-23');
            console.log('Account A received its OTP, verified and entered the member workspace');
            stage = 'authenticated backup in account A';
            const firstNote = 'Synthetic Dev Map Lab backup A';
            await backup(firstPage, firstNote);
            console.log('Account A saved revision 1 with its real Neon Data API session');
            stage = 'restore in a second browser context';
            activePage = secondDevice;
            await login(secondDevice, first);
            await secondDevice.getByText(/目前雲端版本 1，包含 1 則筆記/).waitFor();
            assert(await button(secondDevice, '備份到雲端').isDisabled());
            await button(secondDevice, '讀取雲端並合併').click();
            await secondDevice.getByText(/已合併雲端資料/).waitFor();
            assert.equal(await (await lesson(secondDevice)).inputValue(), firstNote);
            console.log('Account A restored its note from the independent browser context');
            stage = 'second account verification and backup isolation';
            activePage = secondPage;
            await signup(secondPage, second, 'Dev Map QA B 2026-11-23');
            assert.equal(await (await lesson(secondPage)).inputValue(), '');
            await backup(secondPage, 'Synthetic Dev Map Lab backup B');
            console.log('Account B started with empty data and saved its own revision 1');
            stage = 'password reset and session revocation';
            const recovery = await open(browser, 'A recovery');
            activePage = recovery;
            const replacement = secret();
            await recover(recovery, first, replacement);
            await login(recovery, first, true);
            await login(recovery, { ...first, password: replacement });
            await account(firstPage);
            await form(firstPage, '登入').waitFor();
            await account(secondDevice);
            await form(secondDevice, '登入').waitFor();
            await account(secondPage);
            await signedIn(secondPage);
            console.log('OTP password reset, rejecting the old password, revoked old A sessions, and independent B session passed');
          } catch (error) {
            console.error('Stopped during ' + stage + ': ' + clean(error.message).slice(0, 450));
            const state = activePage ? await activePage.locator('main').first().innerText({ timeout: 2000 }).catch(() => '') : '';
            if (state) console.error('Visible application state: ' + clean(state).replaceAll('\n', ' | ').slice(0, 400));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE_TEST
          node "$RUNNER_TEMP/devmap-test.mjs"
